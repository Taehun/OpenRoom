name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, unit, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Uses the exact pnpm version pinned in package.json "packageManager".

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (demo journeys)
        run: pnpm run test:e2e

      - name: Smoke test (Shopify-mode journeys)
        run: pnpm run test:e2e:commerce

      - name: Build (Next)
        run: pnpm run build:next

      - name: Build (static export for Cloudflare Pages)
        run: pnpm run build:pages

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            test-results-commerce
          if-no-files-found: ignore
          retention-days: 7
