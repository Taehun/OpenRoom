name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, unit, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Uses the exact pnpm version pinned in package.json "packageManager".

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (demo journeys)
        run: pnpm run test:e2e

      - name: Smoke test (Shopify-mode journeys)
        run: pnpm run test:e2e:commerce

      - name: Build (Next)
        run: pnpm run build:next

      - name: Build (vinext for Cloudflare Workers)
        run: pnpm run build

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            test-results-commerce
          if-no-files-found: ignore
          retention-days: 7

  check-deploy-secrets:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [ci, check-deploy-secrets]
    if: needs.check-deploy-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Repository *variables*, not secrets: NEXT_PUBLIC_* is inlined into the
      # client bundle at build time, so it is public anyway and it must reach
      # this job — a Worker runtime var can never patch an inlined bundle.
      NEXT_PUBLIC_COMMERCE_PROVIDER: ${{ vars.NEXT_PUBLIC_COMMERCE_PROVIDER }}
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ vars.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
      NEXT_PUBLIC_SHOPIFY_VARIANTS: ${{ vars.NEXT_PUBLIC_SHOPIFY_VARIANTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (vinext for Cloudflare Workers)
        run: pnpm run build

      - name: Verify the store domain was inlined into the client bundle
        run: |
          if [ -z "$NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN" ]; then
            echo "::notice::NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN is not set; deploying in demo mode."
            exit 0
          fi
          if grep -rqF "$NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN" dist/client; then
            echo "Store domain inlined into dist/client."
          else
            echo "::error::build did not inline the store domain (${NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN}) into dist/client; the deployed site would silently stay in demo mode. Check the NEXT_PUBLIC_* repository variables on the deploy job."
            exit 1
          fi

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          pnpm run deploy:vinext 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1 || true)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${url:-<see log>}"
